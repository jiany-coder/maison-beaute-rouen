name: Mise à jour des avis Google
on:
  schedule: [{ cron: '17 5 * * 1' }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/maj-avis-google.mjs
        env: { GOOGLE_PLACES_API_KEY: '${{ secrets.GOOGLE_PLACES_API_KEY }}' }
      - run: |
          git config user.name "maj-avis"; git config user.email "maj-avis@users.noreply.github.com"
          git add data/avis.json; git diff --cached --quiet || git commit -m "Avis Google : mise à jour automatique" && git push
